<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ========== 基础 SEO ========== -->
    <title>D的世界 - 跑路的duck | 个人主页</title>
    <meta
      name="description"
      content="跑路的duck 的个人主页：技术分享、开源项目与生活随笔。域名 pldduck.com 的助记词是「跑路的（pld）duck（duck）」。"
    />
    <meta name="author" content="跑路的duck" />
    <meta name="keywords" content="跑路的duck,pldduck,D的世界,个人主页,开源项目,技术博客,编程" />
    <link rel="canonical" href="https://www.pldduck.com/" />

    <!-- ========== 主题（沿用 D-blog 的存储约定，但默认浅色）========== -->
    <!-- theme-color 先声明浅色，由下方引导脚本在判定为深色时改写为 void：
         站点默认不跟随系统深色，若按 media 声明就会在「系统深色 + 页面浅色」时
         让浏览器工具栏与页面明暗相反。 -->
    <meta name="theme-color" content="#f2f0e9" />
    <!-- color-scheme 只声明 light：UA 组件（滚动条 / 表单控件）默认按浅色渲染，
         深色由 src/index.css 的 html.dark { color-scheme: dark } 覆盖。 -->
    <meta name="color-scheme" content="light" />
    <!-- 无闪烁主题引导：CSS 生效前补上 html.dark。默认浅色，仅当用户显式选过深色
         （localStorage['theme'] === 'dark'）才切换，不再读取系统偏好。
         存储键 'theme'、取值 'light' | 'dark' 与 D-blog 一致。
         CSP 的 script-src 已含 'unsafe-inline'（见 edgeone.json），内联脚本不会被拦。 -->
    <script>
      (function () {
        var dark = false;
        try {
          dark = localStorage.getItem('theme') === 'dark';
        } catch (_) {}
        if (!dark) return;
        document.documentElement.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#0a0a0a');
      })();
    </script>

    <!-- ========== 站点图标 ========== -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <!-- iOS 主屏图标：180x180 深色底 + 鸭子（由 logo.png 白底图去色键合成） -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

    <!-- ========== Open Graph（微信 / 微博 / Telegram 等社交平台抓取卡片） ========== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="D的世界" />
    <meta property="og:title" content="D的世界 - 跑路的duck | 个人主页" />
    <meta
      property="og:description"
      content="一只游手好闲的鸭子。技术分享、开源项目与生活随笔，欢迎来 D 的世界逛逛。"
    />
    <meta property="og:url" content="https://www.pldduck.com/" />
    <meta property="og:image" content="https://www.pldduck.com/logo.png" />
    <meta property="og:image:alt" content="跑路的duck 的像素鸭子 Logo" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="494" />
    <meta property="og:locale" content="zh_CN" />

    <!-- ========== Twitter Card ========== -->
    <!-- logo 为 512x494 小图，低于 large_image 的 1200x630 推荐尺寸，使用 summary 卡片 -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="D的世界 - 跑路的duck | 个人主页" />
    <meta name="twitter:description" content="一只游手好闲的鸭子。技术分享、开源项目与生活随笔。" />
    <meta name="twitter:image" content="https://www.pldduck.com/logo.png" />
    <meta name="twitter:image:alt" content="跑路的duck 的像素鸭子 Logo" />

    <!-- ========== 结构化数据：让搜索引擎识别站点主体人物信息 ========== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "跑路的duck",
        "url": "https://www.pldduck.com/",
        "description": "一只游手好闲的鸭子，技术分享与开源项目作者。",
        "sameAs": ["https://github.com/ououduck"],
        "image": "https://www.pldduck.com/logo.png"
      }
    </script>
    <!-- WebSite 结构化数据：声明搜索收录的官方域名，帮助搜索引擎理解站点归属 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "D的世界",
        "url": "https://www.pldduck.com/",
        "inLanguage": "zh-CN"
      }
    </script>

    <!-- ========== 第三方资源预连接：提前建立连接，减少字体与头像、统计的请求等待 ========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://q1.qlogo.cn" />
    <link rel="preconnect" href="https://www.clarity.ms" />

    <!-- ========== Google Fonts（异步加载避免阻塞首屏；noscript 场景回退到同步加载） ==========
         Playfair Display 与 D-blog 同一份衬线标题字；正文用系统中文无衬线栈（不加载 Inter）。
         preload 与 stylesheet 的 crossorigin 必须一致，否则 preload 缓存作废、CSS 被下载两次
         （浏览器按 URL + 请求模式 + 凭据模式匹配，preload 默认 cors/anonymous）。
         注意：字体家族名大小写敏感，Zcool+KuaiLe 会返回 400，必须使用官方写法 ZCOOL+KuaiLe -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=ZCOOL+KuaiLe&display=swap"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
      crossorigin
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=ZCOOL+KuaiLe&display=swap"
        rel="stylesheet"
        crossorigin
      />
    </noscript>

    <!-- ========== Microsoft Clarity 用户行为统计（异步加载，不阻塞渲染） ========== -->
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = 'https://www.clarity.ms/tag/' + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, 'clarity', 'script', 'yk9o0zquaf');
    </script>
  </head>
  <body>
    <!-- 全局噪点纹理背景，独立于 React 根节点，避免重渲染影响；纯装饰，对读屏隐藏 -->
    <div class="bg-noise" aria-hidden="true"></div>
    <div id="root"></div>
    <!-- 禁用 JS 时给出说明，避免空页面造成困惑（无 JS 即无主题脚本，按默认浅色呈现） -->
    <noscript>
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #f2f0e9;
          color: #57534e;
          font-family: system-ui, sans-serif;
          font-size: 14px;
          padding: 24px;
          text-align: center;
        "
      >
        本站为单页应用，需要启用 JavaScript 才能正常显示，请开启后刷新页面。
      </div>
    </noscript>
    <!-- 应用入口：Tailwind 样式由 Vite 在构建期编译注入，不再依赖 CDN 运行时 -->
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
