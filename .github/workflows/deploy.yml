# deploy.yml — 手动触发的双平台部署流水线。
#
# 构建在 GitHub Actions 完成（公开仓库免费无限额度），产物通过直传（direct upload）
# 推送到 Cloudflare Pages 与 EdgeOne Pages，两个平台均不消耗构建额度。
#
# 触发方式（仅 workflow_dispatch，日常 push 到 main 不会触发任何部署）：
#   1. Pages CMS 侧边栏「🚀 部署到 Cloudflare & EdgeOne」按钮（见 .pages.yml 的 actions 段），
#   2. GitHub Actions 页面手动 Run workflow（payload 留空即可，部署触发分支；也可传 {"repository":{"ref":"main"}}）。
#
# Pages CMS 会以 JSON 字符串填充 inputs.payload（含 repository.ref / sha、触发人等），
# 协议见 https://pagescms.org/docs/configuration/actions/
name: Deploy to Cloudflare & EdgeOne

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Pages CMS payload as JSON（留空时按默认 {} 处理，即部署当前分支）'
        required: false
        type: string
        default: '{}'

concurrency:
  # 连续触发只保留最新一次：避免快速连点产生重复构建/部署。
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Pages CMS 触发时按 CMS 当前打开的分支检出（校验见下一步，仅允许 main）；
          # 手动触发（空 payload）时回退到触发分支。
          # GHA 表达式对空值安全：fromJSON('{}').repository.ref 返回空串，不会报错。
          ref: ${{ fromJSON(inputs.payload).repository.ref || '' }}

      # 站点只部署 main：workflow_dispatch 的 payload 是外部可控 JSON，若直接采用任意
      # repository.ref，恶意分支的构建代码会在持有部署令牌的环境中执行。此处显式校验，
      # 非 main 分支直接失败（空 payload 表示手动触发，放行）。
      - name: Validate dispatch ref
        run: |
          REF="${{ fromJSON(inputs.payload).repository.ref }}"
          if [ -n "$REF" ] && [ "$REF" != "main" ]; then
            echo "::error::部署仅允许 main 分支，收到 ref: $REF"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 类型检查（含站点配置 JSON 字段校验）：缺字段/类型不符的配置在部署前即失败，
      # 避免「CMS 保存了无效配置 → 构建照常成功 → 线上运行时才报错」。
      - name: Type check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 直传（direct upload）部署：平台不构建，不消耗构建额度。
        # 需先在 Cloudflare 控制台创建名为 dworld 的 Pages 项目。
        run: npx --yes wrangler@4 pages deploy dist --project-name=dworld --branch=main --commit-dirty=true

      - name: Deploy to EdgeOne Pages
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        # 直传部署（EdgeOne CLI 仅支持直传类型项目），-e production 为生产环境。
        # 命令为 makers deploy（pages deploy 为改名前的旧命令，官方文档页尚未更新）。
        # 需先在 EdgeOne 控制台创建名为 dworld 的 Pages 项目。
        run: npx --yes edgeone@1 makers deploy ./dist -n dworld -e production -t "$EDGEONE_API_TOKEN"
