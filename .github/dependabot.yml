# Dependabot 已停用：open-pull-requests-limit 设为 0 即不再自动开升级 PR。
# 依赖升级改为手动进行；如需恢复，把两个 limit 改回正数即可。
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    labels:
      - 'ci'
